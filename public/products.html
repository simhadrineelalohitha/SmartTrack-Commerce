<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - SmartTrack Commerce</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filters-sidebar {
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .filter-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .filter-section h3 { font-size: 16px; margin-bottom: 10px; }
        .filter-option { padding: 5px 0; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .product-image { width: 100%; height: 250px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-brand { font-size: 12px; color: #666; text-transform: uppercase; }
        .product-name { font-size: 16px; font-weight: 600; margin: 5px 0; }
        .product-price { font-size: 20px; color: #e74c3c; font-weight: bold; margin: 10px 0; }
        .product-price .original { text-decoration: line-through; font-size: 14px; color: #999; margin-left: 8px; }
        .product-rating { color: #f39c12; margin: 5px 0; }
        .product-actions { display: flex; gap: 10px; margin-top: 10px; }
        .product-actions button { flex: 1; padding: 8px; font-size: 14px; }
        .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px; background: white; border-radius: 8px; }
        .view-toggle { display: flex; gap: 10px; }
        .view-toggle button { padding: 8px 12px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .view-toggle button.active { background: #3498db; color: white; border-color: #3498db; }
        .loading-spinner { text-align: center; padding: 40px; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .compare-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #2c3e50; color: white; padding: 15px; display: none; justify-content: space-between; align-items: center; z-index: 999; }
        .compare-items { display: flex; gap: 10px; }
        .compare-item { background: #34495e; padding: 8px 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- Navigation (reusing from index.html) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">SmartTrack Commerce</a>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search products..." class="search-input">
                <button id="searchBtn" class="btn">Search</button>
            </div>
            <div class="nav-links">
                <a href="wishlist.html">❤️ Wishlist</a>
                <a href="comparison.html">⚖️ Compare</a>
                <a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
                <a href="orders.html">📦 Orders</a>
                <a href="#" id="accountLink">Account</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div style="display: grid; grid-template-columns: 250px 1fr; gap: 30px;">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <h2>Filters</h2>
                
                <div class="filter-section">
                    <h3>Category</h3>
                    <div id="categoryFilters"></div>
                </div>

                <div class="filter-section">
                    <h3>Price Range</h3>
                    <div class="filter-option">
                        <input type="number" id="minPrice" placeholder="Min" style="width: 100px;">
                        <span> - </span>
                        <input type="number" id="maxPrice" placeholder="Max" style="width: 100px;">
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Availability</h3>
                    <div class="filter-option">
                        <label><input type="checkbox" id="inStockOnly"> In Stock Only</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Rating</h3>
                    <div class="filter-option">
                        <label><input type="radio" name="rating" value="4"> 4★ & above</label>
                    </div>
                    <div class="filter-option">
                        <label><input type="radio" name="rating" value="3"> 3★ & above</label>
                    </div>
                    <div class="filter-option">
                        <label><input type="radio" name="rating" value=""> All Ratings</label>
                    </div>
                </div>

                <button class="btn btn-secondary" id="clearFilters">Clear All Filters</button>
            </aside>

            <!-- Products Area -->
            <main>
                <div class="sort-bar">
                    <div>
                        <h2 id="resultsTitle">All Products</h2>
                        <p id="resultsCount" style="color: #666; margin-top: 5px;"></p>
                    </div>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <label for="sortSelect">Sort by:</label>
                        <select id="sortSelect" class="form-input" style="width: auto;">
                            <option value="">Relevance</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="rating">Customer Rating</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>

                <div id="productsContainer">
                    <div class="loading-spinner">
                        <p>Loading products...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Compare Bar -->
    <div class="compare-bar" id="compareBar">
        <div class="compare-items" id="compareItems"></div>
        <div>
            <button class="btn" id="compareBtn">Compare Products</button>
            <button class="btn btn-secondary" id="clearCompare">Clear</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allProducts = [];
        let compareList = JSON.parse(localStorage.getItem('compareList') || '[]');
        
        async function loadCategories() {
            try {
                const response = await fetch('/api/products/categories/list');
                const categories = await response.json();
                const container = document.getElementById('categoryFilters');
                container.innerHTML = categories.map(cat => `
                    <div class="filter-option">
                        <label>
                            <input type="checkbox" class="category-filter" value="${cat}"> ${cat}
                        </label>
                    </div>
                `).join('');
                
                document.querySelectorAll('.category-filter').forEach(cb => {
                    cb.addEventListener('change', applyFilters);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadProducts() {
            const params = new URLSearchParams(window.location.search);
            const urlParams = {};
            for (const [key, value] of params) {
                urlParams[key] = value;
            }

            const queryString = new URLSearchParams(urlParams).toString();
            const response = await fetch(`/api/products?${queryString}`);
            allProducts = await response.json();
            displayProducts(allProducts);
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            document.getElementById('resultsCount').textContent = `${products.length} products found`;
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No products found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `<div class="product-grid">${products.map(product => {
                const discount = product.discount || 0;
                const originalPrice = product.price + discount;
                const hasDiscount = discount > 0;
                
                return `
                    <div class="product-card">
                        <img src="${product.image_url}" alt="${product.name}" class="product-image" 
                             onclick="window.location.href='product.html?id=${product.id}'">
                        <div class="product-info">
                            ${product.brand ? `<div class="product-brand">${product.brand}</div>` : ''}
                            <div class="product-name">${product.name}</div>
                            <div class="product-rating">
                                ${'★'.repeat(Math.round(product.avg_rating || 0))}${'☆'.repeat(5-Math.round(product.avg_rating || 0))}
                                <span style="color: #666; font-size: 12px;">(${product.review_count || 0})</span>
                            </div>
                            <div class="product-price">
                                $${parseFloat(product.price).toFixed(2)}
                                ${hasDiscount ? `<span class="original">$${originalPrice.toFixed(2)}</span>` : ''}
                            </div>
                            ${product.stock > 0 ? '' : '<p style="color: red; font-size: 12px;">Out of Stock</p>'}
                            <div class="product-actions">
                                <button class="btn btn-secondary" onclick="addToWishlist(${product.id})">❤️</button>
                                <button class="btn btn-secondary" onclick="toggleCompare(${product.id})">⚖️</button>
                                <button class="btn" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}</div>`;
            
            updateCompareBar();
        }

        function applyFilters() {
            const categories = Array.from(document.querySelectorAll('.category-filter:checked')).map(cb => cb.value);
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const inStock = document.getElementById('inStockOnly').checked;
            const rating = document.querySelector('input[name="rating"]:checked')?.value;
            const search = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortSelect').value;

            const params = new URLSearchParams();
            if (categories.length) params.set('category', categories.join(','));
            if (minPrice) params.set('minPrice', minPrice);
            if (maxPrice) params.set('maxPrice', maxPrice);
            if (inStock) params.set('inStock', 'true');
            if (search) params.set('search', search);
            if (sort) params.set('sort', sort);

            window.location.href = `products.html?${params.toString()}`;
        }

        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('minPrice').addEventListener('change', applyFilters);
        document.getElementById('maxPrice').addEventListener('change', applyFilters);
        document.getElementById('inStockOnly').addEventListener('change', applyFilters);
        document.querySelectorAll('input[name="rating"]').forEach(r => r.addEventListener('change', applyFilters));
        
        document.getElementById('searchBtn').addEventListener('click', applyFilters);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            window.location.href = 'products.html';
        });

        function toggleCompare(productId) {
            const idx = compareList.indexOf(productId);
            if (idx > -1) {
                compareList.splice(idx, 1);
            } else {
                if (compareList.length >= 3) {
                    showNotification('You can only compare up to 3 products', 'error');
                    return;
                }
                compareList.push(productId);
            }
            localStorage.setItem('compareList', JSON.stringify(compareList));
            updateCompareBar();
        }

        function updateCompareBar() {
            const bar = document.getElementById('compareBar');
            const itemsContainer = document.getElementById('compareItems');
            
            if (compareList.length === 0) {
                bar.style.display = 'none';
                return;
            }
            
            bar.style.display = 'flex';
            const items = compareList.map(id => {
                const product = allProducts.find(p => p.id === id);
                return product ? `<div class="compare-item">${product.name} <button onclick="toggleCompare(${id})" style="background:none;border:none;color:white;cursor:pointer;">×</button></div>` : '';
            }).join('');
            itemsContainer.innerHTML = items;
        }

        document.getElementById('compareBtn').addEventListener('click', () => {
            if (compareList.length < 2) {
                showNotification('Please select at least 2 products to compare', 'error');
                return;
            }
            window.location.href = `comparison.html?ids=${compareList.join(',')}`;
        });

        document.getElementById('clearCompare').addEventListener('click', () => {
            compareList = [];
            localStorage.setItem('compareList', JSON.stringify(compareList));
            updateCompareBar();
        });

        async function addToCart(productId) {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const response = await fetch('/api/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity: 1 })
                });
                
                if (response.ok) {
                    showNotification('Added to cart!', 'success');
                    updateCartCount();
                } else {
                    showNotification('Failed to add to cart', 'error');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                showNotification('Error adding to cart', 'error');
            }
        }

        async function addToWishlist(productId) {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const response = await fetch('/api/wishlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId })
                });
                
                if (response.ok) {
                    showNotification('Added to wishlist!', 'success');
                } else {
                    showNotification('Failed to add to wishlist', 'error');
                }
            } catch (error) {
                console.error('Error adding to wishlist:', error);
            }
        }

        // Initialize
        loadCategories();
        loadProducts();
        updateCartCount();
    </script>
</body>
</html>
