<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - SmartTrack Commerce</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .dashboard-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .dashboard-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
    }

    .dashboard-header h1 {
      color: white;
      margin-bottom: 0.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .dashboard-card {
      background: var(--bg-primary);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .dashboard-card h3 {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dashboard-card .value {
      font-size: 2rem;
      font-weight: var(--font-weight-bold);
      color: var(--primary-color);
    }

    .recent-orders {
      background: var(--bg-primary);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .recent-orders h2 {
      margin-bottom: 1.5rem;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border-light);
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-info {
      flex: 1;
    }

    .order-id {
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }

    .order-date {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .track-btn {
      padding: 0.5rem 1rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: var(--font-weight-medium);
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .track-btn:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="container">
        <div class="nav-brand" onclick="window.location.href='/'">
          <h1>SmartTrack Commerce</h1>
          <p class="tagline">Shop. Secure. Track.</p>
        </div>
        <div class="nav-links" id="navLinks">
          <a href="/" class="nav-link">Home</a>
          <a href="/?page=products" class="nav-link">Products</a>
          <a href="/track-order.html" class="nav-link">Track Order</a>
          <a href="/dashboard.html" class="nav-link">Dashboard</a>
          <a href="/?page=cart" class="nav-link">
            Cart <span class="badge" id="cartBadge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h1>Welcome, <span id="userName">Customer</span>!</h1>
        <p>Track your orders and manage your account</p>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Total Orders</h3>
          <div class="value" id="totalOrders">0</div>
        </div>
        <div class="dashboard-card">
          <h3>Active Orders</h3>
          <div class="value" id="activeOrders">0</div>
        </div>
        <div class="dashboard-card">
          <h3>Delivered Orders</h3>
          <div class="value" id="deliveredOrders">0</div>
        </div>
      </div>

      <div class="recent-orders">
        <h2>Recent Orders</h2>
        <div id="recentOrdersList">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading orders...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 SmartTrack Commerce. All rights reserved.</p>
  </footer>

  <script>
    let currentUser = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          window.location.href = '/login.html?redirect=dashboard';
          return false;
        }
        const data = await response.json();
        currentUser = data.user;
        document.getElementById('userName').textContent = currentUser.name;
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/login.html?redirect=dashboard';
        return false;
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/orders');
        if (!response.ok) throw new Error('Failed to load orders');
        
        const orders = await response.json();
        
        // Calculate stats
        const totalOrders = orders.length;
        const activeOrders = orders.filter(o => 
          ['Order Placed', 'Order Confirmed', 'Packed', 'Shipped', 'Out for Delivery'].includes(o.status)
        ).length;
        const deliveredOrders = orders.filter(o => o.status === 'Delivered').length;
        
        document.getElementById('totalOrders').textContent = totalOrders;
        document.getElementById('activeOrders').textContent = activeOrders;
        document.getElementById('deliveredOrders').textContent = deliveredOrders;
        
        // Display recent orders
        const recentOrdersList = document.getElementById('recentOrdersList');
        
        if (orders.length === 0) {
          recentOrdersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📦</div>
              <h3>No orders yet</h3>
              <p>Start shopping to see your orders here</p>
              <a href="/?page=products" class="btn btn-primary">Browse Products</a>
            </div>
          `;
        } else {
          recentOrdersList.innerHTML = orders.slice(0, 5).map(order => `
            <div class="order-item">
              <div class="order-info">
                <div class="order-id">Order #${order.id}</div>
                <div class="order-date">${new Date(order.created_at).toLocaleDateString()} • ${order.status}</div>
              </div>
              <a href="/track-order.html?id=${order.id}" class="track-btn">Track Order</a>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('recentOrdersList').innerHTML = `
          <div class="empty-state">
            <p style="color: var(--danger-color);">Error loading orders</p>
          </div>
        `;
      }
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cartBadge');
      if (badge) {
        badge.textContent = totalItems;
      }
    }

    (async function init() {
      const isAuth = await checkAuth();
      if (isAuth) {
        loadDashboard();
        updateCartBadge();
      }
    })();
  </script>
</body>
</html>
