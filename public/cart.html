<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SmartTrack Commerce</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/modern.css">
    <style>
        .cart-container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .cart-content { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        .cart-items { background: white; padding: 20px; border-radius: 8px; }
        .cart-item { display: grid; grid-template-columns: 100px 1fr auto auto; gap: 15px; padding: 15px; border-bottom: 1px solid #eee; align-items: center; }
        .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; }
        .item-details h3 { margin: 0 0 5px 0; font-size: 16px; }
        .item-price { font-size: 18px; font-weight: bold; color: #e74c3c; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        .quantity-controls button { width: 30px; height: 30px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .cart-summary { background: white; padding: 20px; border-radius: 8px; height: fit-content; position: sticky; top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin: 10px 0; }
        .summary-row.total { font-size: 20px; font-weight: bold; border-top: 2px solid #ddd; padding-top: 15px; margin-top: 15px; }
        .empty-cart { text-align: center; padding: 60px 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">SmartTrack Commerce</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html" class="active">Cart</a>
                <a href="orders.html">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container cart-container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <button class="btn btn-secondary" onclick="clearCart()">Clear Cart</button>
        </div>

        <div id="cartContent">
            <div class="empty-cart">
                <h3>Loading cart...</h3>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        async function loadCart() {
            if (!isLoggedIn()) {
                document.getElementById('cartContent').innerHTML = `
                    <div class="empty-cart">
                        <h3>Please login to view your cart</h3>
                        <a href="login.html" class="btn">Login</a>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('/api/cart');
                const cartItems = await response.json();

                if (cartItems.length === 0) {
                    document.getElementById('cartContent').innerHTML = `
                        <div class="empty-cart">
                            <h3>Your cart is empty</h3>
                            <p>Start shopping to add items to your cart</p>
                            <a href="products.html" class="btn">Browse Products</a>
                        </div>
                    `;
                    return;
                }

                displayCart(cartItems);
            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('cartContent').innerHTML = `
                    <div class="empty-cart">
                        <h3>Error loading cart</h3>
                        <p>Please try again later</p>
                    </div>
                `;
            }
        }

        function displayCart(items) {
            const subtotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1;
            const total = subtotal + tax;

            document.getElementById('cartContent').innerHTML = `
                <div class="cart-content">
                    <div class="cart-items">
                        <h2>Cart Items (${items.length})</h2>
                        ${items.map(item => `
                            <div class="cart-item">
                                <img src="${item.image_url}" alt="${item.name}">
                                <div class="item-details">
                                    <h3>${item.name}</h3>
                                    <p style="color: #666; font-size: 14px;">${item.description.substring(0, 80)}...</p>
                                    ${item.brand ? `<p style="font-size: 12px; color: #999;">Brand: ${item.brand}</p>` : ''}
                                    <p style="font-size: 14px; color: ${item.stock > 0 ? 'green' : 'red'};">
                                        ${item.stock > 0 ? `In stock` : 'Out of stock'}
                                    </p>
                                </div>
                                <div class="quantity-controls">
                                    <button onclick="updateQuantity(${item.product_id}, ${item.quantity - 1})">-</button>
                                    <span style="min-width: 30px; text-align: center;">${item.quantity}</span>
                                    <button onclick="updateQuantity(${item.product_id}, ${item.quantity + 1})">+</button>
                                </div>
                                <div style="text-align: right;">
                                    <div class="item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="removeItem(${item.product_id})">Remove</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span>$${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%):</span>
                            <span>$${tax.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span>FREE</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span>$${total.toFixed(2)}</span>
                        </div>
                        <a href="checkout.html" class="btn" style="width: 100%; display: block; text-align: center; margin-top: 20px;">Proceed to Checkout</a>
                        <a href="products.html" class="btn btn-secondary" style="width: 100%; display: block; text-align: center; margin-top: 10px;">Continue Shopping</a>
                    </div>
                </div>
            `;
        }

        async function updateQuantity(productId, newQuantity) {
            if (newQuantity < 1) {
                await removeItem(productId);
                return;
            }

            try {
                const response = await fetch('/api/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity: newQuantity })
                });

                if (response.ok) {
                    loadCart();
                    updateCartCount();
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        async function removeItem(productId) {
            try {
                const response = await fetch(`/api/cart/${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadCart();
                    updateCartCount();
                    showNotification('Item removed from cart', 'success');
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }

        async function clearCart() {
            if (!confirm('Are you sure you want to clear your cart?')) return;

            try {
                const response = await fetch('/api/cart');
                const items = await response.json();

                for (const item of items) {
                    await fetch(`/api/cart/${item.product_id}`, { method: 'DELETE' });
                }

                loadCart();
                updateCartCount();
                showNotification('Cart cleared', 'success');
            } catch (error) {
                console.error('Error clearing cart:', error);
            }
        }

        loadCart();
        updateCartCount();
    </script>
</body>
</html>
