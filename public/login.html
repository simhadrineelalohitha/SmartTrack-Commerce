<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartTrack Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-page-container {
      width: 100%;
      max-width: 450px;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 3rem 2.5rem;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .auth-title {
      font-size: 2rem;
      color: #2c3e50;
      margin: 0 0 0.5rem 0;
    }

    .auth-subtitle {
      color: #7f8c8d;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2c3e50;
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
      border-color: #e74c3c;
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #ecf0f1;
    }

    .auth-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-weight: 500;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      text-align: center;
      margin: 2rem 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #ecf0f1;
    }

    .divider span {
      background: white;
      padding: 0 1rem;
      position: relative;
      color: #7f8c8d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">⚡</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="Enter your email"
            required
            autofocus
          >
          <div id="email-error" class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter your password"
            required
          >
          <div id="password-error" class="error-message"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          Sign In
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="auth-footer">
        <p style="color: #7f8c8d; margin: 0;">
          Don't have an account? 
          <a href="register.html" class="auth-link">Create one</a>
        </p>
        <p style="color: #7f8c8d; margin: 1rem 0 0 0;">
          <a href="index.html" class="auth-link">← Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Form elements
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');

    // Helper functions
    function showError(inputId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(`${inputId}-error`);
      input.classList.add('error');
      error.textContent = message;
      error.classList.add('show');
    }

    function clearError(inputId) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(`${inputId}-error`);
      input.classList.remove('error');
      error.classList.remove('show');
    }

    function showAlert(message, type) {
      alert.textContent = message;
      alert.className = `alert alert-${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {
          alert.classList.remove('show');
        }, 3000);
      }
    }

    // Email validation
    emailInput.addEventListener('blur', function() {
      const email = this.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (email && !emailRegex.test(email)) {
        showError('email', 'Please enter a valid email address');
      } else {
        clearError('email');
      }
    });

    // Form submission
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Clear previous errors
      ['email', 'password'].forEach(clearError);
      alert.classList.remove('show');

      // Get values
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validate
      let hasError = false;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        showError('email', 'Please enter a valid email address');
        hasError = true;
      }

      if (!password) {
        showError('password', 'Password is required');
        hasError = true;
      }

      if (hasError) return;

      // Submit
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          
          // Store user data for the SPA
          if (data.user) {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
          }
          
          // Check for redirect parameter
          const urlParams = new URLSearchParams(window.location.search);
          const redirectPage = urlParams.get('redirect');
          const redirectUrl = redirectPage === 'checkout' ? '/checkout.html' : 
                              redirectPage === 'orders' ? '/orders.html' : 
                              'index.html';
          
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 1000);
        } else {
          showAlert(data.error || 'Login failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Check if user is already logged in
    window.addEventListener('load', async function() {
      try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
          const data = await response.json();
          if (data.user) {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            
            // Check for redirect parameter
            const urlParams = new URLSearchParams(window.location.search);
            const redirectPage = urlParams.get('redirect');
            const redirectUrl = redirectPage === 'checkout' ? '/checkout.html' : 
                                redirectPage === 'orders' ? '/orders.html' : 
                                'index.html';
            
            window.location.href = redirectUrl;
          }
        }
      } catch (error) {
        console.log('Not logged in');
      }
    });
  </script>
</body>
</html>
