<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SmartTrack Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-page-container {
      width: 100%;
      max-width: 450px;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 3rem 2.5rem;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .auth-title {
      font-size: 2rem;
      color: #2c3e50;
      margin: 0 0 0.5rem 0;
    }

    .auth-subtitle {
      color: #7f8c8d;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2c3e50;
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
      border-color: #e74c3c;
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .password-strength {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .strength-bar {
      height: 4px;
      background: #ecf0f1;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      transition: all 0.3s;
      width: 0;
    }

    .strength-weak { width: 33%; background: #e74c3c; }
    .strength-medium { width: 66%; background: #f39c12; }
    .strength-strong { width: 100%; background: #27ae60; }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #ecf0f1;
    }

    .auth-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-weight: 500;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">⚡</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join SmartTrack Commerce today</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="Enter your full name"
            required
          >
          <div id="name-error" class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="Enter your email"
            required
          >
          <div id="email-error" class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Create a password (min. 6 characters)"
            required
          >
          <div class="password-strength">
            <div class="strength-bar">
              <div id="strength-fill" class="strength-fill"></div>
            </div>
            <span id="strength-text" style="color: #7f8c8d; font-size: 0.85rem;"></span>
          </div>
          <div id="password-error" class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-input" 
            placeholder="Re-enter your password"
            required
          >
          <div id="confirmPassword-error" class="error-message"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p style="color: #7f8c8d; margin: 0;">
          Already have an account? 
          <a href="login.html" class="auth-link">Sign in</a>
        </p>
        <p style="color: #7f8c8d; margin: 1rem 0 0 0;">
          <a href="index.html" class="auth-link">← Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Form elements
    const form = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');
    const strengthFill = document.getElementById('strength-fill');
    const strengthText = document.getElementById('strength-text');

    // Password strength checker
    passwordInput.addEventListener('input', function() {
      const password = this.value;
      const length = password.length;
      
      if (length === 0) {
        strengthFill.className = 'strength-fill';
        strengthText.textContent = '';
      } else if (length < 6) {
        strengthFill.className = 'strength-fill strength-weak';
        strengthText.textContent = 'Weak - Need at least 6 characters';
        strengthText.style.color = '#e74c3c';
      } else if (length < 8) {
        strengthFill.className = 'strength-fill strength-medium';
        strengthText.textContent = 'Medium - Consider adding more characters';
        strengthText.style.color = '#f39c12';
      } else {
        strengthFill.className = 'strength-fill strength-strong';
        strengthText.textContent = 'Strong password!';
        strengthText.style.color = '#27ae60';
      }
    });

    // Real-time validation
    function showError(inputId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(`${inputId}-error`);
      input.classList.add('error');
      error.textContent = message;
      error.classList.add('show');
    }

    function clearError(inputId) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(`${inputId}-error`);
      input.classList.remove('error');
      error.classList.remove('show');
    }

    function showAlert(message, type) {
      alert.textContent = message;
      alert.className = `alert alert-${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {
          alert.classList.remove('show');
        }, 3000);
      }
    }

    // Email validation
    emailInput.addEventListener('blur', function() {
      const email = this.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (email && !emailRegex.test(email)) {
        showError('email', 'Please enter a valid email address');
      } else {
        clearError('email');
      }
    });

    // Password match validation
    confirmPasswordInput.addEventListener('input', function() {
      if (this.value && this.value !== passwordInput.value) {
        showError('confirmPassword', 'Passwords do not match');
      } else {
        clearError('confirmPassword');
      }
    });

    // Form submission
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Clear previous errors
      ['name', 'email', 'password', 'confirmPassword'].forEach(clearError);
      alert.classList.remove('show');

      // Get values
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validate
      let hasError = false;

      if (!name || name.length < 2) {
        showError('name', 'Name must be at least 2 characters long');
        hasError = true;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        showError('email', 'Please enter a valid email address');
        hasError = true;
      }

      if (!password || password.length < 6) {
        showError('password', 'Password must be at least 6 characters long');
        hasError = true;
      }

      if (password !== confirmPassword) {
        showError('confirmPassword', 'Passwords do not match');
        hasError = true;
      }

      if (hasError) return;

      // Submit
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showAlert(data.error || 'Registration failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
