<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - E-Commerce Store</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .checkout-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 30px;
    }

    .checkout-section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .checkout-section h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .order-summary {
      position: sticky;
      top: 80px;
      height: fit-content;
    }

    .order-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
    }

    .order-item-details {
      flex: 1;
    }

    .order-item-name {
      font-weight: 500;
      color: #333;
      margin-bottom: 5px;
    }

    .order-item-price {
      color: #666;
      font-size: 14px;
    }

    .order-item-quantity {
      color: #888;
      font-size: 14px;
    }

    .order-totals {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }

    .total-row.final {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .place-order-btn {
      width: 100%;
      padding: 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .place-order-btn:hover {
      background: #45a049;
    }

    .place-order-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-cart-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-cart h2 {
      color: #666;
      margin-bottom: 10px;
    }

    .empty-cart p {
      color: #999;
      margin-bottom: 30px;
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .loading-spinner {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }

      .order-summary {
        position: static;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <a href="/">E-Store</a>
        </div>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search products...">
          <button id="searchBtn">Search</button>
        </div>
        <div class="nav-links" id="navLinks">
          <a href="/">Home</a>
          <a href="/?page=products">Products</a>
          <a href="/?page=cart">Cart <span class="cart-badge" id="cartBadge">0</span></a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="checkout-container" id="checkoutContainer">
      <!-- Left side: Customer Information Form -->
      <div class="checkout-section">
        <h2>Shipping Information</h2>
        
        <div class="error-message" id="errorMessage"></div>

        <form id="checkoutForm">
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit phone number" required>
          </div>

          <div class="form-group">
            <label for="address">Street Address *</label>
            <input type="text" id="address" name="address" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City *</label>
              <input type="text" id="city" name="city" required>
            </div>

            <div class="form-group">
              <label for="state">State *</label>
              <input type="text" id="state" name="state" required>
            </div>
          </div>

          <div class="form-group">
            <label for="pincode">Pincode *</label>
            <input type="text" id="pincode" name="pincode" placeholder="6-digit pincode" maxlength="6" required>
          </div>

          <button type="submit" class="place-order-btn" id="placeOrderBtn">
            Place Order
          </button>
        </form>
      </div>

      <!-- Right side: Order Summary -->
      <div class="checkout-section order-summary">
        <h2>Order Summary</h2>
        <div id="orderItems"></div>
        <div class="order-totals">
          <div class="total-row">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="total-row">
            <span>Shipping</span>
            <span>FREE</span>
          </div>
          <div class="total-row final">
            <span>Total</span>
            <span id="total">$0.00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty Cart State -->
    <div class="empty-cart" id="emptyCart" style="display: none;">
      <div class="empty-cart-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <p>Add some products to your cart before checkout</p>
      <a href="/?page=products" class="btn">Browse Products</a>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Processing your order...</p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Check authentication on page load
    let currentUser = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          // Not logged in, redirect to login
          window.location.href = '/login.html?redirect=checkout';
          return false;
        }
        const data = await response.json();
        currentUser = data.user;
        
        // Pre-fill email from user account
        document.getElementById('email').value = currentUser.email;
        document.getElementById('fullName').value = currentUser.name || '';
        
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/login.html?redirect=checkout';
        return false;
      }
    }

    // Load cart and display order summary
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      
      if (cart.length === 0) {
        document.getElementById('checkoutContainer').style.display = 'none';
        document.getElementById('emptyCart').style.display = 'block';
        return;
      }

      displayOrderSummary(cart);
      updateCartBadge();
    }

    // Display order summary
    async function displayOrderSummary(cart) {
      const orderItemsContainer = document.getElementById('orderItems');
      let subtotal = 0;

      // Fetch product details for all cart items
      const productPromises = cart.map(item => 
        fetch(`/api/products/${item.productId}`).then(r => r.json())
      );

      try {
        const products = await Promise.all(productPromises);
        
        orderItemsContainer.innerHTML = products.map((product, index) => {
          const cartItem = cart[index];
          const itemTotal = product.price * cartItem.quantity;
          subtotal += itemTotal;

          return `
            <div class="order-item">
              <img src="${product.image_url}" alt="${product.name}" class="order-item-image" 
                   onerror="this.src='https://via.placeholder.com/80x80?text=No+Image'">
              <div class="order-item-details">
                <div class="order-item-name">${product.name}</div>
                <div class="order-item-price">$${product.price.toFixed(2)} each</div>
                <div class="order-item-quantity">Quantity: ${cartItem.quantity}</div>
              </div>
              <div style="font-weight: 500; color: #333;">
                $${itemTotal.toFixed(2)}
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('total').textContent = `$${subtotal.toFixed(2)}`;
      } catch (error) {
        console.error('Error loading order summary:', error);
        showError('Error loading cart items');
      }
    }

    // Update cart badge
    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cartBadge');
      if (badge) {
        badge.textContent = totalItems;
        badge.style.display = totalItems > 0 ? 'inline-block' : 'none';
      }
    }

    // Handle form submission
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.style.display = 'none';

      // Get form data
      const customerInfo = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        city: document.getElementById('city').value.trim(),
        state: document.getElementById('state').value.trim(),
        pincode: document.getElementById('pincode').value.trim()
      };

      // Client-side validation
      if (!/^\d{10}$/.test(customerInfo.phone.replace(/[-\s]/g, ''))) {
        showError('Please enter a valid 10-digit phone number');
        return;
      }

      if (!/^\d{6}$/.test(customerInfo.pincode)) {
        showError('Please enter a valid 6-digit pincode');
        return;
      }

      // Get cart items
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      
      if (cart.length === 0) {
        showError('Your cart is empty');
        return;
      }

      // Prepare order data
      const orderData = {
        items: cart,
        customerInfo: customerInfo
      };

      // Show loading overlay
      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('placeOrderBtn').disabled = true;

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(orderData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to place order');
        }

        // Order successful - clear cart
        localStorage.removeItem('cart');
        updateCartBadge();

        // Redirect to confirmation page
        window.location.href = `/order-confirmation.html?orderId=${data.orderId}`;
      } catch (error) {
        console.error('Order error:', error);
        showError(error.message || 'Failed to place order. Please try again.');
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('placeOrderBtn').disabled = false;
      }
    });

    // Show error message
    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Initialize page
    (async function init() {
      const isAuthenticated = await checkAuth();
      if (isAuthenticated) {
        loadCart();
      }
    })();
  </script>
</body>
</html>
